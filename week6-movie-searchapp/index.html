<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineSearch — Discover Movies</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="grain"></div>

  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span>CineSearch</span>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="search-section">
      <div class="search-wrapper">
        <div class="search-bar" id="searchBar">
          <span class="search-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          </span>
          <input
            type="text"
            id="searchInput"
            placeholder="Search for a movie…"
            autocomplete="off"
            spellcheck="false"
          />
          <button class="clear-btn" id="clearBtn" aria-label="Clear search">✕</button>
          <div class="search-status" id="searchStatus"></div>
        </div>

        <div class="search-meta" id="searchMeta"></div>

        <div class="recent-searches" id="recentSearches">
          <span class="recent-label">Recent:</span>
          <div class="recent-tags" id="recentTags"></div>
          <button class="clear-recent" id="clearRecent">Clear all</button>
        </div>
      </div>
    </section>

    <div class="loader-wrapper" id="loaderWrapper">
      <div class="loader">
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
      </div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <section class="results-section" id="resultsSection">
      <div class="results-grid" id="resultsGrid"></div>
    </section>

    <div class="pagination" id="pagination"></div>

    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🎬</div>
      <h2>Start searching</h2>
      <p>Type a movie title above to begin exploring</p>
    </div>
  </main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
